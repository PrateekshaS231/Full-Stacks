<!DOCTYPE html>
<html>
<head>
<style>

body{
    background:#f7f5ff;
    font-family:'Segoe UI',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.form-container{
    background:white;
    padding:30px;
    border-radius:20px;
    width:350px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    color:#7c3aed;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:10px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#7c3aed;
    color:white;
    cursor:pointer;
}

#message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.success{
    color:green;
}

.error{
    color:red;
}

</style>
</head>
<body>

<div class="form-container">

    <h2>Student Registration</h2>

    <input type="text" id="name" placeholder="Enter your name">

    <button onclick="validateForm()">
        Submit
    </button>

    <p id="message"></p>

</div>

<script>

function validateForm(){

    let name =
        document.getElementById("name").value;

    let message =
        document.getElementById("message");

    if(name.trim()===""){

        message.innerHTML =
        "Please enter your name";

        message.className =
        "error";
    }

    else{

        message.innerHTML =
        "Welcome, " + name + "!";

        message.className =
        "success";
    }

}

</script>

</body>
</html>
